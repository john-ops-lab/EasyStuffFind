name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Compile
        run: python -m compileall -q easystufffind scripts tests skills/openclaw/scripts

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Check generated contract
        run: python scripts/export_openapi.py --check

      - name: Validate OpenClaw Skill
        run: python scripts/validate_skill.py skills/openclaw

      - name: Check dependency integrity
        run: python -m pip check
