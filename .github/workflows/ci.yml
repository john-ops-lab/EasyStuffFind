name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Compile
        run: python -m compileall -q easystufffind scripts tests skills/openclaw/scripts

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Check generated contract
        run: python scripts/export_openapi.py --check

      - name: Validate OpenClaw Skill
        run: python scripts/validate_skill.py skills/openclaw

      - name: Check dependency integrity
        run: python -m pip check
